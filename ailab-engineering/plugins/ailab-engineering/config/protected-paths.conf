# A.I. Lab protected paths — default list shipped with the plugin.
#
# Example paths below are illustrative. Configure actual protected paths before use.
# Format: <class> <absolute-path-prefix>
#
# Classes:
#   immutable   Never modified by agents: backups, frozen evidence, frozen runners.
#               Write/Edit is denied; Bash commands that mutate these paths are denied.
#   appendonly  Evidence/log trees: creating NEW files is allowed, editing or
#               overwriting existing files is denied, deleting is denied.
#   production  Live production code, data and config: any mutation asks the owner.
#   scratch     Designated disposable areas inside protected trees. Never protected,
#               even when they sit under an appendonly/immutable prefix.
#
# Host paths and agent-container mount paths are both listed, because the same
# hooks run on the host and inside agent-long / agent-fast.
#
# Add your own entries in ~/.config/ailab-engineering/protected-paths.conf
# (or the file named by $AILAB_GUARD_CONFIG). Entries there are added to these.

# --- Backups ---------------------------------------------------------------
immutable   /srv/backups
immutable   /home/example-user/backups
immutable   /var/backups
immutable   /mnt/example-backup

# --- Frozen evidence and frozen runners ------------------------------------
immutable   /home/example-user/example-project-ssr/l-evidence
immutable   /home/example-user/example-project-ssr/runs
immutable   /home/example-user/example-project-ssr/bin
immutable   /srv/agent-logs/_imported
immutable   /work/agent-logs/_imported

# --- Evidence and agent logs (append-only) ---------------------------------
appendonly  /srv/agent-logs
appendonly  /work/agent-logs
scratch     /srv/agent-logs/_scratch
scratch     /work/agent-logs/_scratch

# --- Production --------------------------------------------------------------
production  /home/example-user/example-app-production
production  /opt/example-web-website
production  /var/lib/example-web-website
production  /etc/example-web-website
production  /srv/docker
production  /etc/nginx
production  /etc/systemd/system
